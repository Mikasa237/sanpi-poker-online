services:
  sanpi-poker:
    build:
      context: ./outputs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:3000/api/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
